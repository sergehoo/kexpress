<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:0 0 12px;">
  <tr>
    <td class="kx-soft" bgcolor="#f8fafc" style="background-color:#f8fafc;border:1px solid {{ kx.line }};border-left:4px solid {{ accent|default:kx.orange }};border-radius:12px;padding:15px 18px;">
      <p class="kx-strong" style="margin:0 0 4px;font-size:13px;line-height:19px;font-weight:700;color:{{ kx.navy }};">{{ heading }}</p>
      <p class="kx-p" style="margin:0;font-size:13px;line-height:20px;color:#475569;">{{ text }}</p>
    </td>
  </tr>
</table>
