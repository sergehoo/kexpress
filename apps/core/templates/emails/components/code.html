<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:6px 0 24px;border-collapse:separate;">
  <tr>
    <td class="kx-codebox" align="center" bgcolor="{{ kx.orange_soft }}" style="background-color:{{ kx.orange_soft }};border:1px solid {{ kx.orange_line }};border-radius:16px;padding:24px 16px 22px;">
      <p class="kx-code-label" style="margin:0 0 10px;font-size:12px;line-height:16px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#9a3412;">{{ code_label }}</p>
      {% if code|length > 6 %}<p style="margin:0;"><span class="kx-code-long" style="display:inline-block;font-family:{{ kx.mono }};font-size:32px;line-height:46px;font-weight:700;letter-spacing:8px;padding-left:8px;color:{{ kx.navy }};-webkit-user-select:all;user-select:all;mso-line-height-rule:exactly;">{{ code }}</span></p>{% else %}<p style="margin:0;"><span class="kx-code" style="display:inline-block;font-family:{{ kx.mono }};font-size:38px;line-height:50px;font-weight:700;letter-spacing:12px;padding-left:12px;color:{{ kx.navy }};-webkit-user-select:all;user-select:all;mso-line-height-rule:exactly;">{{ code }}</span></p>{% endif %}
      <p class="kx-muted" style="margin:12px 0 0;font-size:13px;line-height:20px;color:#7c2d12;">Valable <strong>{{ validity }}</strong> &middot; usage unique</p>
    </td>
  </tr>
</table>
