<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:6px 0 18px;">
  <tr>
    <td align="center" bgcolor="{{ kx.orange_button }}" style="background-color:{{ kx.orange_button }};border-radius:12px;mso-padding-alt:14px 30px;">
      <a href="{{ url }}" target="_blank" rel="noopener" style="display:inline-block;padding:14px 30px;font-family:{{ kx.font }};font-size:16px;line-height:20px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:12px;">{{ label }}&nbsp;&rarr;</a>
    </td>
  </tr>
